<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>University Registration Form</h1>
        <p>Please fill out the form below to register.</p>
        <hr>


        <h2>Personal Details</h2>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="name" placeholder="e.g., Arjun"><br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="name" placeholder="e.g., Kumar"><br><br>
        
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="file">Upload Photo:</label><br>
        <input type="file" id="file" name="file">
        <hr>


        <h2>Contact Information</h2>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g., 9876543210"><br><br>

        <label for="address">Mailing Address:</label><br>
        <textarea row="3" col="20" placeholder="Street Address City, State, ZIP Code" name="address" id="address"></textarea>
        <hr>


        <h2>Academic Information</h2>
        <label for="course">Course of Study:</label><br>
        <select id="course">
            <option>-- Choose a course --</option>
            <option value="cse">Computer Science Engineering</option>
            <option value="mech">Mechanical Engineering</option>
            <option value="civil">Civil Engineering</option>
        </select>
        <br><br>

        <label>Extracurricular Activities:</label><br>
        <input type="checkbox" value="sports" id="sports" name="sports">
        <label for="sports">Sports</label><br>

        <input type="checkbox" value="music and arts" id="music" name="music_and_arts">
        <label for="music">Music & Arts</label><br>
        
        <input type="checkbox" value="technology clubs" id="tech" name="tech">
        <label for="tech">Technology Clubs</label><br>

        <input type="checkbox" value="volunteering" id="vol" name="vol">
        <label for="vol">Volunteering</label><br><br>

        <hr>

        <h2>Create Your Account</h2>
        <label for="pass">Password:</label>
        <input type="password" name="password" id="pass"><br><br>
        
        <label for="securityq">Security Question:</label><br>
        <select id="securityq">
            <option>-- Choose a security question --</option>
            <option value="pet">What is your pet's name?</option>
            <option value="school">What is the name of your first school?</option>
            <option value="city">In which city were you born?</option>
        </select><br><br>

        <label for="securitya">Security Answer:</label>
        <input type="text" name="security_answer" id="securitya"><br><br>

        <input type="checkbox" id="agree" name="agree">
        <label for="agree">I agree to the terms and conditions</label><br><br>

        <hr>

        <input type="button" value="Register">
        <input type="button" value="Clear Form">
    </form>
</body>
</html>
